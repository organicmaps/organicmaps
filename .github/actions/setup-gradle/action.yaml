name: Set up Gradle
description: Cache Gradle distributions and downloaded Android dependencies

inputs:
  cache-read-only:
    description: Only restore caches; Android Check on master populates them
    default: 'true'

runs:
  using: composite
  steps:
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        # The repository quota is shared with C++ and iOS build caches.
        gradle-home-cache-includes: caches/modules-2
        # setup-gradle extracts these independently of the included paths.
        # Version-specific caches contain generated jars, scripts and transforms.
        gradle-home-cache-excludes: |
          caches/[0-9]*
          caches/jars-*
          caches/transforms-*
          jdks

name: Code style check

on:
  pull_request:
    branches: [ master ]
    # Filter by extension, not by directory: per-module directory lists silently drift
    # when modules move or get added (this filter missed all of android/libs/* since the
    # module split). Same extensions as CLANG_FORMAT_TARGETS in tools/hooks/format-config.bash.
    paths:
      - '**.java'
      - '**.[ch]pp'
      - '**.[hm]'
      - '**.mm'
      - '.clang-format'
      - '.clang-format-ignore'
      - '.github/workflows/code-style-check.yaml'
      - 'tools/hooks/format-config.bash'
      - 'tools/unix/clang-format.sh'

jobs:
  code-style-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install clang-format
        run: |
          sudo apt purge -y clang-format-18  # Remove default old version of clang-format
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-toolchain-noble-22.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22
          sudo update-alternatives --force --install /usr/bin/clang-format clang-format /usr/bin/clang-format-22 10
          sudo update-alternatives --force --install /usr/bin/git-clang-format git-clang-format /usr/bin/git-clang-format-22 10
          clang-format --version

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Run clang-format
        run: tools/unix/clang-format.sh

name: Code style check

on:
  pull_request:
    branches: [ master ]
    # Match extensions to keep new and moved modules covered. Keep in sync with
    # CLANG_FORMAT_TARGETS in tools/hooks/format-config.bash.
    paths:
      - '**.java'
      - '**.[ch]pp'
      - '**.[hm]'
      - '**.mm'
      - '.clang-format'
      - '.clang-format-ignore'
      - '.github/workflows/code-style-check.yaml'
      - 'tools/hooks/format-config.bash'
      - 'tools/unix/clang-format.sh'

jobs:
  code-style-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      # PyPI avoids intermittent failures downloading the apt.llvm.org signing key.
      - name: Install clang-format
        run: |
          source tools/hooks/format-config.bash
          pipx install "clang-format==$CLANG_FORMAT_VERSION.*"

      - name: Run clang-format
        run: tools/unix/clang-format.sh

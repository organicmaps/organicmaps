name: C++ tests

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - .gitignore
      - .github/**
      - '!.github/workflows/cpp-tests.yaml'  # Run check on self change
      - CONTRIBUTORS
      - LICENSE
      - NOTICE
      - README.md
      - android/**
      - data/countries-strings/**
      - data/organic_maps_emoji/**
      - data/sound-strings/**
      - data/strings/**
      - dev_sandbox/**
      - docs/**
      - iphone/**
      - packaging/**
      - qt/**
      - tools/**
      - '!tools/python/test_server/**'
      - xcode/**

# Cancels previous jobs if the same branch or PR was updated again.
# Only cancel PR runs: main runs must finish to populate the shared ccache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Linux clang Debug
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space by removing .NET, Android and Haskell
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Parallel submodules checkout
        run: git submodule update --depth 1 --init --recursive --jobs=20

      - name: Install build tools and dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
              clang-19 \
              libgl1-mesa-dev \
              libglvnd-dev \
              libharfbuzz-dev \
              libxcursor-dev \
              libxi-dev \
              libxinerama-dev \
              libxrandr-dev \
              ninja-build \
              qt6-base-dev \
              qt6-positioning-dev \

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}
          # Restore-only on PRs: main populates the shared cache, PRs read it.
          # Avoids overflowing the 10GB repo limit, which evicts main's caches.
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Configure cmake
        env:
          CC: clang-19
          CXX: clang++-19
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: cmake --preset ci -DCMAKE_BUILD_TYPE=Debug -DSKIP_QT_GUI=ON

      # Only the binaries of the tests run below: the desktop app, dev_sandbox and the tools are
      # not NoGPS Maps targets. Each test is named after its binary; the test server fixtures are not.
      - name: Compile
        run: |
          targets=$({ ctest --preset ci -N; ctest --preset ci-drape -N; } | sed -n 's/^ *Test *#[0-9]*: \(.*_tests\)$/\1/p')
          cmake --build --preset ci --target $targets

      - name: Prepare testing environment
        run: |
          sudo locale-gen en_US
          sudo locale-gen en_US.UTF-8
          sudo locale-gen es_ES
          sudo locale-gen es_ES.UTF-8
          sudo locale-gen fr_FR
          sudo locale-gen fr_FR.UTF-8
          sudo locale-gen ru_RU
          sudo locale-gen ru_RU.UTF-8
          sudo update-locale

      # The omim-test label filter and the exclude list live in CMakePresets.json
      # (test preset "ci"). Excluded suites and why:
      #   drape_tests, drape_frontend_tests, shaders_tests - need offscreen GL, run in the next step
      #   generator_integration_tests - https://github.com/organicmaps/organicmaps/issues/225
      #   routing_integration_tests - https://github.com/organicmaps/organicmaps/issues/221
      #   routing_benchmarks, routing_quality_tests, search_quality_tests - benchmarks, not pass/fail tests
      #   storage_integration_tests - downloads real maps from planet.organicmaps.app (~28 min, ~690 MB);
      #     the offline part of that coverage lives in storage_tests
      - name: Run tests
        run: ctest --preset ci -j$(nproc --all)

      # The "ci-drape" test preset sets QT_QPA_PLATFORM=offscreen.
      - name: Run drape tests
        run: ctest --preset ci-drape --verbose

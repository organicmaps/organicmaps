name: iOS Check
on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - master
    # Keep common paths in sync with ios-beta.yaml, android-check.yaml and android-beta.yaml.
    # Keep iOS paths in sync with ios-beta.yaml, except workflow/version.sh.
    paths: &ios-paths
      # Common inputs
      - .gitattributes
      - .gitmodules
      - '*.h'
      - '*.hpp'
      - 3party/**
      - data/**
      - libs/**
      # iOS inputs
      - .github/workflows/ios-check.yaml
      - iphone/**
      - xcode/**
      # Common exclusions
      - '!**/*.md'
      - '!**/*_tests/**'
      - '!data/borders/**'
      - '!data/organic_maps_emoji/**'
      - '!data/strings/**'
      - '!data/test_data/**'
      # iOS exclusions
      - '!**/CMakeLists.txt'
      - '!iphone/metadata/**'
      - '!libs/platform/*_android*'
      - '!libs/platform/*_linux*'
      - '!libs/platform/*_mac*'
      - '!libs/platform/*qt*'
      - '!libs/platform/*_win*'
  pull_request:
    paths: *ios-paths

jobs:
  ios-check:
    name: Build iOS
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      LANG: en_US.UTF-8  # Fastlane complains that the terminal is using ASCII.
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    strategy:
      fail-fast: false
      matrix:
        buildType: [Debug, Release]
    # Cancels previous jobs if the same branch or PR was updated again.
    # Only cancel PR runs: master runs must finish to populate the shared cache.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.buildType }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: write  # To delete unnecessary cache.

    steps:
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Show current version of Xcode
        run: xcodebuild -version

      # Remove after https://github.com/actions/runner-images/issues/14548 is fixed.
      - name: Ensure Metal Toolchain is available
        run: |
          if ! xcrun metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -k
          fi
          xcrun metal -v

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(sysctl -n hw.logicalcpu) * 20))

      - name: Configure XCode cache
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.workflow }}-${{ matrix.buildType }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.workflow }}-${{ matrix.buildType }}
          # Restore-only on PRs: master populates the shared cache, PRs read it.
          # Avoids overflowing the 10GB repo limit, which evicts master's caches.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          # Only master may delete its used cache; otherwise a PR would delete
          # the master DerivedData it just restored from (via restore-keys).
          delete-used-deriveddata-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Build for Testing (Debug)
        if: matrix.buildType == 'Debug'
        shell: bash
        run: |
          xcodebuild build-for-testing \
            -workspace xcode/omim.xcworkspace \
            -scheme OMaps \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run XCTest (Debug)
        if: matrix.buildType == 'Debug'
        timeout-minutes: 15
        shell: bash
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/ios-tests
        run: |
          mkdir -p "$TEST_RESULTS_DIR"
          sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${sdk_version//./-}"
          simulator=$(xcrun simctl create 'Organic Maps CI' com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro \
            "$runtime")
          trap 'xcrun simctl shutdown "$simulator" || true; xcrun simctl delete "$simulator" || true' EXIT
          xcrun simctl bootstatus "$simulator" -b 2>&1 | tee "$TEST_RESULTS_DIR/simulator-boot.log"
          xcodebuild test-without-building \
            -workspace xcode/omim.xcworkspace \
            -scheme OMaps \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator,arch=arm64" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -resultBundlePath "$TEST_RESULTS_DIR/OMaps.xcresult" \
            2>&1 | tee "$TEST_RESULTS_DIR/xctest.log"

      - name: Upload XCTest Diagnostics (Debug)
        if: ${{ matrix.buildType == 'Debug' && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests
          if-no-files-found: ignore

      - name: Build (Release)
        if: matrix.buildType == 'Release'
        shell: bash
        run: |
          xcodebuild build \
            -workspace xcode/omim.xcworkspace \
            -scheme OMaps \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -quiet \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

name: Android SDK Check
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: &sdk-paths
      - android/sdk/**
      - android/groovy/**
      - android/gradle/**
      - android/gradle.properties
      - android/build.gradle
      - android/settings.gradle
      - android/gradlew*
      - tools/unix/version.sh
      - .github/scripts/check-sdk-aar.sh
      - .github/workflows/android-sdk-check.yaml
  pull_request:
    paths: *sdk-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api-docs:
    name: SDK API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Needed by tools/unix/version.sh.
          fetch-depth: 200
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate and check API documentation
        working-directory: android
        run: ./gradlew -Parm64 sdkApiDocs
      - uses: actions/upload-artifact@v7
        with:
          name: android-sdk-api
          path: android/build/sdk-api
          if-no-files-found: error

  consumer:
    name: Published SDK consumer
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6
        with:
          # Needed by tools/unix/version.sh.
          fetch-depth: 200
      - name: Parallel submodules checkout
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.workflow }}-consumer
          save: ${{ github.ref == 'refs/heads/master' }}
      - name: Build and lint independent Maven consumers
        working-directory: android
        run: ./gradlew -Px86_64 -PsdkVersion=0.0.0-sdk-check sdkConsumerCheck
      - name: Verify packaged SDK runtime
        working-directory: android
        run: bash ../.github/scripts/check-sdk-aar.sh sdk/build/outputs/aar/sdk-release.aar
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the minified release consumer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          working-directory: android
          script: ./gradlew -Px86_64 -PsdkVersion=0.0.0-sdk-check sdkConsumerConnectedCheck
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-sdk-consumer-reports
          path: android/sdk/consumer/app/build/reports

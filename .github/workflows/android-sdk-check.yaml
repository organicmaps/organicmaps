name: Android SDK Documentation
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: &sdk-paths
      - android/sdk/**
      - android/groovy/**
      - android/gradle/**
      - android/gradle.properties
      - android/build.gradle
      - android/settings.gradle
      - android/gradlew*
      - tools/unix/version.sh
      - tools/python/check_sdk_docs.py
      - .github/workflows/android-sdk-check.yaml
  pull_request:
    paths: *sdk-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api-docs:
    name: SDK API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Needed by tools/unix/version.sh.
          fetch-depth: 200
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate and check API documentation
        working-directory: android
        run: ./gradlew -Parm64 sdkApiDocs
      - uses: actions/upload-artifact@v7
        with:
          name: android-sdk-api
          path: android/build/sdk-api
          if-no-files-found: error

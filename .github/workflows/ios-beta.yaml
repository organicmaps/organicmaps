name: iOS Beta
on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - master
    # Keep in sync with ios-check.yaml, plus the version.sh exception below.
    paths-ignore:
      - .agents/**
      - .claude/**
      - .gemini/**
      - .gitignore
      - .github/**
      - '!.github/workflows/ios-beta.yaml'  # Upload a beta on self change
      - '**/*.md'
      - '**/*_tests/**'
      - '**/CMakeLists.txt'
      - CMakePresets.json
      - CONTRIBUTORS
      - LICENSE
      - NOTICE
      - android/**
      - cmake/**
      - data/organic_maps_emoji/**
      - data/strings/**
      - dev_sandbox/**
      - docs/**
      - generator/**
      - iphone/metadata/**
      - libs/platform/*_android*
      - libs/platform/*_linux*
      - libs/platform/*_mac*
      - libs/platform/*qt*
      - libs/platform/*_win*
      - packaging/**
      - qt*/**
      - tools/**
      - '!tools/unix/version.sh'  # Used by the TestFlight lane to generate the version

jobs:
  ios-beta:
    name: Apple TestFlight
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      LANG: en_US.UTF-8  # Fastlane complains that the terminal is using ASCII.
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    environment: beta
    defaults:
      run:
        shell: bash
    steps:
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Show current version of Xcode
        run: xcodebuild -version

      # Remove after https://github.com/actions/runner-images/issues/14548 is fixed.
      - name: Ensure Metal Toolchain is available
        run: |
          if ! xcrun metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -k
          fi
          xcrun metal -v

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 100 # enough to get all commits for the current day

      - name: Parallel submodules checkout
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(sysctl -n hw.logicalcpu) * 20))

      - name: Restore beta keys
        shell: bash
        run: |
          mkdir -p xcode/keys
          echo "$PRIVATE_H" | base64 -d > private.h
          echo "$APPSTORE_JSON" | base64 -d > xcode/keys/appstore.json
          echo "$CERTIFICATES_DEV_P12" | base64 -d > xcode/keys/CertificatesDev.p12
          echo "$CERTIFICATES_DISTR_P12" | base64 -d > xcode/keys/CertificatesDistr.p12
        env:
          PRIVATE_H: ${{ secrets.PRIVATE_H }}
          APPSTORE_JSON: ${{ secrets.APPSTORE_JSON }}
          CERTIFICATES_DEV_P12: ${{ secrets.CERTIFICATES_DEV_P12 }}
          CERTIFICATES_DISTR_P12: ${{ secrets.CERTIFICATES_DISTR_P12 }}

      - name: Compile and upload to TestFlight
        run: |
          echo "IOS_VERSION=$(../tools/unix/version.sh ios_version)-$(../tools/unix/version.sh ios_build)" >> "$GITHUB_ENV"
          ./fastlane.sh upload_testflight
        env:
          APPSTORE_CERTIFICATE_PASSWORD: '${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}'
        working-directory: xcode

      - name: Upload ipa and DSYMs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ipa and DSYM archive ${{ env.IOS_VERSION }}
          path: xcode/build/*
          if-no-files-found: error

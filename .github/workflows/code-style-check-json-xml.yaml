name: Code style check - JSON/XML

on:
  pull_request:
    branches: [ master ]
    paths: # Keep in sync with INCLUDE/EXCLUDE in tools/python/format_json_xml.py
      - '.github/workflows/code-style-check-json-xml.yaml'
      - 'tools/hooks/pre-commit'
      - 'tools/python/format_json_xml.py'
      - 'tools/python/format_json_xml_test.py'
      - 'android/**.xml'
      - 'android/**.json'
      - 'data/conf/**.json'
      - 'data/skipped_elements.json'
      - 'package.json'
      - '!android/**/res/values*/*strings.xml'  # twine-generated
      - '!android/**/assets/countries.json'      # map generator output

jobs:
  code-style-check-json-xml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run formatter tests
        run: python3 tools/python/format_json_xml_test.py

      # Check touched files only; existing files adopt the format when edited.
      - name: Run JSON/XML formatter check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- '*.json' '*.xml' |
            xargs -0 --no-run-if-empty python3 tools/python/format_json_xml.py files

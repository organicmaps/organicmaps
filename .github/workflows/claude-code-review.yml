name: Claude Code Review

# Reviews a pull request once, when it opens or leaves draft. Comment `@claude review` to ask again.
# Off unless the repository variable CLAUDE_REVIEW is `on` (Settings > Secrets and variables > Actions > Variables).
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    if: vars.CLAUDE_REVIEW == 'on' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

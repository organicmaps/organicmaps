name: Code style check - Swift

on:
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/code-style-check-swift.yaml'
      - 'iphone/.swift-version'
      - 'iphone/.swiftformat'
      - 'iphone/**.swift'

jobs:
  code-style-check-swift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Pinned: Homebrew installs the newest release, and a release with new rules fails every PR at once.
      - name: Install swiftformat
        env:
          VERSION: 0.63.1
          SHA256: 9e10090e0213378c68cedb42adc2c6461916a9c8e457cf452b5585b84096c333
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$VERSION/swiftformat_linux.zip"
          echo "$SHA256  swiftformat.zip" | sha256sum --check
          unzip -q swiftformat.zip
          install -D swiftformat_linux bin/swiftformat
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          bin/swiftformat --version

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Run swiftformat
        run: |
          swiftformat iphone
          git diff --exit-code  # swiftformat reformats in place and always exits 0.

      - name: Post swiftformat comments
        if: failure()
        uses: reviewdog/action-suggester@aa38384ceb608d00f84b4690cacc83a5aba307ff # v1.24.0
        with:
          fail_level: error
          tool_name: swiftformat
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEWDOG_TOKEN }}

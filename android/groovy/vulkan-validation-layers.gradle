import javax.inject.Inject

// Downloads Vulkan validation layers and packs them into the module as jniLibs.
// The layers are published as GitHub release archives only, see the ivy repository in settings.gradle.
abstract class UnpackVulkanValidationLayers extends DefaultTask {
  @InputFiles
  abstract ConfigurableFileCollection getArchive()

  // Layers are packed only for the ABIs the native library is built for, otherwise Android may
  // select an ABI that has a validation layer but no liborganicmaps.so.
  @Input
  abstract SetProperty<String> getAbiFilters()

  @OutputDirectory
  abstract DirectoryProperty getOutputDir()

  @Inject
  abstract FileSystemOperations getFileSystemOperations()

  @Inject
  abstract ArchiveOperations getArchiveOperations()

  @TaskAction
  void unpack() {
    def abis = abiFilters.get()
    fileSystemOperations.sync {
      from(archiveOperations.zipTree(archive.singleFile)) {
        include abis.collect { "*/$it/**" }
        // Strip the top-level "android-binaries-<version>" directory, jniLibs expects ABI dirs at the root.
        eachFile { path = path.substring(path.indexOf('/') + 1) }
        includeEmptyDirs = false
      }
      into(outputDir)
    }
  }
}

ext.EnableVulkanDiagnostics = { Project project ->
  def android = project.extensions.getByName('android')
  def layers = project.configurations.resolvable('vulkanValidationLayers')

  project.dependencies {
    // The release archive is not a jar, so the artifact has to be declared explicitly.
    vulkanValidationLayers(libs.vulkan.validation.layers) {
      artifact {
        name = 'android-binaries'
        type = 'zip'
        extension = 'zip'
      }
    }
  }

  def unpackVulkanValidationLayers =
      project.tasks.register('unpackVulkanValidationLayers', UnpackVulkanValidationLayers) {
        description = 'Downloads and unpacks Vulkan validation layers into jniLibs.'
        archive.from(layers)
        abiFilters.set(android.defaultConfig.ndk.abiFilters)
        outputDir = project.layout.buildDirectory.dir('vulkanValidationLayers')
      }

  def androidComponents = project.extensions.getByName('androidComponents')
  androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.jniLibs.addGeneratedSourceDirectory(unpackVulkanValidationLayers) { it.outputDir }
  }
}

plugins {
  id 'com.android.library'
}

apply from: "${rootProject.rootDir}/groovy/common-config.gradle"

android {
  namespace = 'app.organicmaps.sdk.sync.gms'
  enableKotlin = true  // see app/build.gradle

  compileOptions {
    coreLibraryDesugaringEnabled = true
  }
}

dependencies {
  implementation project(':sdk')

  coreLibraryDesugaring libs.android.tools.desugaring

  implementation libs.androidx.annotation
  implementation libs.google.gms.auth
  implementation libs.kotlinx.coroutines.android
  implementation libs.okhttp

  testImplementation libs.androidx.junit
  testImplementation libs.kotlinx.coroutines.test
  testImplementation libs.mockito.core
  testImplementation libs.okhttp.mockwebserver
  // android.jar stubs of org.json throw in JVM unit tests.
  testImplementation libs.org.json
}

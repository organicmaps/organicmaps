plugins {
  id 'com.android.library'
}

apply from: "${rootProject.rootDir}/groovy/common-config.gradle"
apply from: "${rootProject.rootDir}/groovy/publishing.gradle"
apply from: "${rootProject.rootDir}/groovy/vulkan-validation-layers.gradle"

def onOffProperty = { String name ->
  def value = project.findProperty(name) ?: 'OFF'
  if (value != 'ON' && value != 'OFF')
    throw new GradleException("Property $name must be ON or OFF, but is '$value'.")
  return value
}

def enableVulkanDiagnostics = onOffProperty('app.organicmaps.enableVulkanDiagnostics')

android {
  namespace = 'app.organicmaps.sdk'
  enableKotlin = true  // see app/build.gradle

  buildFeatures {
    buildConfig = true
  }

  defaultConfig {
    externalNativeBuild {
      def pchFlag = onOffProperty('pch')
      def njobs = project.findProperty('njobs') ?: ''
      def enableTrace = onOffProperty('app.organicmaps.enableTrace')
      def drapeBenchmark = onOffProperty('app.organicmaps.drapeBenchmark')
      def cmakeUnityBuild = project.findProperty('app.organicmaps.cmakeUnityBuild')
      def cmakeUnityBatchSize = project.findProperty('app.organicmaps.cmakeUnityBatchSize')

      cmake {
        cppFlags '-fexceptions', '-frtti'
        cFlags '-Wno-extern-c-compat'
        arguments '-DANDROID_TOOLCHAIN=clang', '-DANDROID_STL=c++_static',
            '-DBUILD_TESTING=OFF', '-DSKIP_TOOLS=ON', "-DUSE_PCH=$pchFlag",
            "-DNJOBS=$njobs", "-DENABLE_VULKAN_DIAGNOSTICS=$enableVulkanDiagnostics",
            "-DENABLE_TRACE=$enableTrace", "-DDRAPE_QUEUE_TRACE=$drapeBenchmark", "-DDRAPE_SCENARIO=$drapeBenchmark"
        // Passed through only when set, so CMake keeps owning the defaults.
        if (cmakeUnityBuild)
          arguments "-DCMAKE_UNITY_BUILD=$cmakeUnityBuild"
        if (cmakeUnityBatchSize)
          arguments "-DCMAKE_UNITY_BUILD_BATCH_SIZE=$cmakeUnityBatchSize"
        targets 'organicmaps'
      }
    }

    // Use, for example, -Parm32 gradle parameter to build only for armeabi-v7a.
    ndk {
      abiFilters = new HashSet<>()
      if (project.hasProperty('arm32') || project.hasProperty('armeabi-v7a')) {
        abiFilters.add('armeabi-v7a')
      }
      if (project.hasProperty('arm64') || project.hasProperty('arm64-v8a')) {
        abiFilters.add('arm64-v8a')
      }
      if (project.hasProperty('x86')) {
        abiFilters.add('x86')
      }
      if (project.hasProperty('x86_64') || project.hasProperty('x64')) {
        abiFilters.add('x86_64')
      }
      if (abiFilters.isEmpty()) {
        abiFilters.add('armeabi-v7a')
        abiFilters.add('arm64-v8a')
        // For the emulator, chromebooks and some Intel Atom devices.
        abiFilters.add('x86_64')
        abiFilters.add('x86')
      }
      println('Building for ' + abiFilters + ' archs.')
    }

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  externalNativeBuild {
    cmake {
      version = '3.22.1+'
      buildStagingDirectory './nativeOutputs'
      path '../../CMakeLists.txt'
    }
  }

  compileOptions {
    coreLibraryDesugaringEnabled = true
  }
}

dependencies {
  api project(':sdk:location:core')
  api libs.androidx.lifecycle
  api libs.androidx.recyclerview
  api libs.androidx.fragment

  coreLibraryDesugaring libs.android.tools.desugaring

  implementation libs.androidx.annotation
  implementation libs.androidx.core
  implementation libs.androidx.media
  implementation libs.okhttp

  testImplementation libs.androidx.junit
  testImplementation libs.mockito.inline
  androidTestImplementation libs.androidx.junit
  androidTestImplementation libs.androidx.test.runner
}

if (enableVulkanDiagnostics == 'ON') {
  EnableVulkanDiagnostics(project)
}

// TODO: Running lint task triggers native build. Find a better solution.
project.afterEvaluate {
  boolean isLintRun = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('lint') }

  if (isLintRun) {
    tasks.findAll { task ->
      (task.name.startsWith('Native') || task.name.contains('CMake')) &&
          task.project == project
    }.each { nativeTask ->
      logger.warn("Disabling task ${nativeTask.path} because lint is running.")
      nativeTask.onlyIf { false }
    }
  }
}

Publish(project, [
    'artifactId' : 'sdk',
    'name'       : 'Organic Maps SDK',
    'description': 'An open-source Android library for building fully offline, privacy-respecting map and navigation applications powered by OpenStreetMap data and Organic Maps'
])

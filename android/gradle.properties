propMinSdkVersion=21
propTargetSdkVersion=36
propCompileSdkVersion=37
propNdkVersion=29.0.14206865

org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m -Xms512m
android.useAndroidX=true
android.native.buildOutput=verbose
android.nonTransitiveRClass=true
android.nonFinalResIds=true

app.organicmaps.enableVulkanDiagnostics=OFF
app.organicmaps.enableTrace=OFF
app.organicmaps.drapeBenchmark=OFF
# Commented out to let cmake manage the default behavior
# app.organicmaps.cmakeUnityBuild=ON
# app.organicmaps.cmakeUnityBatchSize=50

# Languages packaged in the app and listed in the per-app language picker.
# Regenerate locales_config.xml with tools/unix/generate_localizations.sh after changing this list.
# Only languages that are present in android/app/src/main/res/values-*/strings.xml should be listed here.
supportedLocalizations=ar,en

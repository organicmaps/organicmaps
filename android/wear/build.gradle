plugins {
    id 'com.android.application'
}

apply from: "${rootProject.rootDir}/groovy/common-config.gradle"
apply from: "${rootProject.rootDir}/groovy/application-signing.gradle"

android {
    namespace 'app.organicmaps.wear'
    enableKotlin = true  // see app/build.gradle

    defaultConfig {
        applicationId rootProject.ext.appId
        // Stay above the legacy 10x code range while leaving headroom for three-digit daily commit counts.
        versionCode rootProject.ext.versionCode + 10_00_00_00_00
        versionName rootProject.ext.versionName
        minSdk 26
    }

    flavorDimensions 'default'

    productFlavors {
        google {
            dimension 'default'
            versionName = android.defaultConfig.versionName + '-Google'
        }
    }
}

dependencies {
    implementation project(':libs:branding')
    implementation project(':libs:wear-protocol')
    implementation project(':libs:wear-protocol-gms')
    implementation libs.google.gms.wearable

    testImplementation libs.androidx.junit
    testImplementation libs.mockito.core
}
